<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		header{background:linear-gradient(45deg,lightblue,pink);width:100%;height:100px;text-align:center;}
		footer{background-color:grey;width:100%;height:100px;text-align:center}
		body{font-family:Garamond;}
		ul li a{margin:20px;text-decoration:none;position:relative;}
		ul li a:hover{color:purple;}
		ul li a::before{content:"";display:block;height:4px;background-color:#00FA9A;position:absolute;top:0;left:0;width:0%;transition:all ease-in-out 250ms;}
		ul li a:hover::before{width:100%;}
		.contactform{text-align:center;font-family:Garamond;background-color:lightblue;}
		#myform{border:5px solid green;background-color:#bbe5b8;width:30%;margin-left:33%;padding:20px;border-radius:5px}
		#myform input,textarea{padding:10px;margin:10px;}
		textarea{height:100px;}
		div input[type="submit"]{background-color:green;}
		#errormessage{margin:20px;color:red;font-weight:bold;}
		
	</style>
	<script>
		function validate(){
			var name1 = document.getElementById("name").value;
			var phone1 = document.getElementById("phone").value;
			var email1 = document.getElementById("email").value;
			var message1 = document.getElementById("message").value;

			if (name1.length<5)
			{
			text = "Enter your full name.";
			errormessage.innerHTML = text;
			return false;
			}

			if (phone1.length!=10 || isNaN(phone1))
			{
			text = "Enter a valid phone number";
			errormessage.innerHTML = text;
			return false;
			}

			if (email1.length<6 || email1.indexOf("@")==-1)
			{
			text = "Enter a valid email";
			errormessage.innerHTML = text;
			return false;
			}
			
			if (message1.length<150)
			{
			text = "Enter a message more than 150 characters";
			errormessage.innerHTML = text;
			return false;
			}
			alert("Form Submitted Successfully");
			return true;
		}
	</script>
</head>
<body>
    <header>
	<h1>Explore Maldives</h1>
        <nav>
            <ul>
                <li style=display:inline-block><a href="index.html">Home</a></li>
                <li style=display:inline-block><a href="destinations.html">Destinations</a></li>
		<li style=display:inline-block><a href="places.html">Places to Stay</a></li>
		<li style=display:inline-block><a href="food.html">Local Food</a></li>
                <li style=display:inline-block><a href="ContactUs.html">Contact Us</a></li>
		<li style=display:inline-block><a href="faq.html">FAQ</a></li>
		<li style=display:inline-block><a href="customer feedback tourism.html">Customer Feedback</a></li>
		
            </ul>
        </nav>
    </header>

	<main>
		<div class="contactform">
			<h2>Contact Us</h2>
			<form id="myform" onsubmit="return validate();" action="https://docs.google.com/forms/u/0/d/1Ljb1_rYSMOhTvZHVE-qWGfLcwAfntiKEd_kiBepTK8w/previewResponse">
				<div>
					<input type="text" placeholder="Name" id="name" name="entry.228357921">
				</div>
				<div>
					<input type="text" placeholder="Phone" id="phone" phone="entry.1657880537">
				</div>
				<div>
					<input type="text" placeholder="Email" id="email" email="entry.1846219752">
				</div>
				<div>
					<textarea placeholder="Message" id="message" message="entry.1588927282"></textarea>
				</div>
				<div>
					<input type="submit">
				</div>
				<div id="errormessage"></div>
			</form>
			
		</div>
	</main>

<footer>

</body>
</html>
